name: Boletin Semanal de Videos Educativos

on:
  schedule:
    # Viernes a las 18:00 hs Argentina (UTC-3) -> 21:00 UTC
    - cron: '0 21 * * 5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ejecutar-agente-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar agente de videos
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python agente_videos_educacion.py
