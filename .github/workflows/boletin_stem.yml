name: Boletin Semanal STEM

on:
  schedule:
    # 09:00 hs Argentina (UTC-3) corresponde a las 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch: # Permite dispararlo manualmente para pruebas

# Permisos necesarios para que el bot pueda hacer commit y push a la rama
permissions:
  contents: write

jobs:
  ejecutar-agente:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar agente de innovacion
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python agente_biblio_educacion.py

      - name: Publicar cambios en GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff-index --quiet HEAD || (git commit -m "Actualizar observatorio en GitHub Pages [skip ci]" && git push)
